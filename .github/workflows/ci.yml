name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  binding:
    name: python binding on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package
        run: python -m pip install ".[core]"

      - name: Run the binding tests
        run: python -m unittest discover bindings/python/tests
